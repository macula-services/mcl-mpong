# Structural lint and unit tests, in the SAME image the Containerfile builds in:
# the team's macula-ci-otp by digest (OTP 28.4.3, rebar3 3.27.0, Rust 1.98.1,
# cmake and a C toolchain, all pinned). macula's NIFs build from source here.

name: lint-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      # ⚠ MUST BE THE Containerfile's CI_OTP, character for character.
      # mcl_mpong_service_tests fails when they differ.
      image: ghcr.io/macula-io/macula-ci-otp:20260923-1347@sha256:b2260d084a3d3c5e0b74932c4ee052a0cadfddddb6587d5d2214873e6bb06330
    steps:
      - uses: actions/checkout@v4
      - run: rebar3 lint
      - run: rebar3 eunit
